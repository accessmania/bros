<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resize Form 5</title>
<style>
    html, body { margin: 0; height: 100%; box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', Inter, system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #ede9fe;
        color: #4c1d95;
    }
    .rf-label { font-size: 1.1rem; font-weight: 700; }
    .rf-size { margin-top: 6px; font-size: 0.8rem; color: #6b4fa0; }
</style>
</head>
<body>
    <div class="rf-label">Form 5 — 상태바</div>
    <div class="rf-size" id="rf-size">-</div>
    <script>
        function reportSize() {
            var el = document.getElementById('rf-size');
            el.textContent = Math.round(document.documentElement.clientWidth) + ' x ' + Math.round(document.documentElement.clientHeight) + ' px';
        }
        window.addEventListener('resize', reportSize);
        reportSize();
    </script>
</body>
</html>
